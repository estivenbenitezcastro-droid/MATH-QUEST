MI=setInterval(()=>{n++;if(n%2==0)tone(r[k]/2*2**(s[(n>>1)%5]/12),0,.3,'triangle',.05);if(Math.random()<.7)tone(r[k]*2*2**(P(s)/12),0,.2,'square',.02)},t[k])}
addEventListener('pointerdown',()=>{const c=ac();if(c&&c.state=='suspended')c.resume()});
/* ---------- Partículas ---------- */
const cv=$('#fx'),cx=cv.getContext('2d');let ps=[];
const rz=()=>{cv.width=innerWidth;cv.height=innerHeight};rz();addEventListener('resize',rz);
function burst(n=50){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;for(let i=0;i<n;i++)ps.push({x:innerWidth/2,y:innerHeight*.55,vx:(Math.random()-.5)*14,vy:-Math.random()*12-2,l:60,c:P(['#e21b3c','#1368ce','#d89e00','#26890c','#fff'])})}
(function lp(){cx.clearRect(0,0,cv.width,cv.height);ps=ps.filter(p=>p.l>0);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.4;p.l--;cx.fillStyle=p.c;cx.fillRect(p.x,p.y,8,8)});requestAnimationFrame(lp)})();
/* ---------- Utilidades UI ---------- */
const V=h=>{$('#v').innerHTML=h;scrollTo(0,0)};
function theme(i){const c=i<0?['#46178f','#1368ce']:W[i].c,s=$('#bg').style;s.setProperty('--c1',c[0]);s.setProperty('--c2',c[1]);const a=i<0?['➕','➖','✖️','➗','π','√','%','∑']:W[i].ic;$('#bg').innerHTML=Array.from({length:10},(_,j)=>`<i style="left:${j*10}%;animation-delay:-${j*1.6}s;animation-duration:${13+j%4*4}s">${a[j%a.length]}</i>`).join('')}
function toast(t){const e=$('#toast');e.textContent=t;e.style.opacity=1;clearTimeout(e._t);e._t=setTimeout(()=>e.style.opacity=0,2400)}
const hdr=t=>`<div class=hud><button class="btn w" style="padding:8px 14px" onclick="menu()">◀ Menú</button><h2 style="font-size:30px">${t}</h2></div>`;
const AL=[['p1','🎯','Primer paso','Acierta tu primer acertijo',()=>D.ok>=1],['r5','🔥','En llamas','Racha de 5 aciertos',()=>D.smax>=5],['r10','🌋','Imparable','Racha de 10 aciertos',()=>D.smax>=10],['rayo','⚡','Rayo','Acierta en menos de 3 segundos',()=>D.fl.rayo],['jefe','👹','Cazajefes','Derrota a un jefe',()=>D.done.some(x=>x)],['imp','💎','Impecable','Gana un mundo sin perder vidas',()=>D.fl.imp],['coin','🪙','Millonario','Reúne 500 monedas',()=>D.coins>=500],['n5','🎖️','Nivel 5','Llega al nivel 5',()=>lv()>=5],['all','👑','Leyenda','Completa los 7 mundos',()=>D.done.every(x=>x)]];
const chk=()=>AL.forEach(a=>{if(!D.ach[a[0]]&&a[4]()){D.ach[a[0]]=1;toast(`🏆 Logro: ${a[2]}`)}});
function addxp(n){const a=lv();D.xp+=n;if(lv()>a)toast(`¡Nivel ${lv()}! ${av()}`)}
const stopT=()=>{if(G)clearInterval(G.iv)};
/* ---------- Pantallas ---------- */
function menu(){stopT();G=null;theme(-1);music(-1);
V(`<div style="margin-top:3vh"><h1>MATH<br>QUEST</h1><p class=t style="text-align:center;font-size:clamp(20px,5vw,30px);margin-top:12px">El Desafío Matemático</p></div>
<p style="text-align:center;max-width:520px;margin:0 auto">“Bienvenido a MATH QUEST. Solo los jugadores que dominen las matemáticas podrán llegar al desafío final.”</p>
<div class=hud style="justify-content:center"><span class=chip>${av()} Nivel ${lv()}</span><span class=chip>⭐ Récord ${D.best}</span><span class=chip>🪙 ${D.coins}</span></div>
<div style="display:grid;gap:12px;max-width:420px;width:100%;margin:6px auto">
<button class="btn r" onclick="play()">▶ JUGAR</button><button class="btn b" onclick="worlds()">🌎 MUNDOS</button><button class="btn y" onclick="achs()">🏆 LOGROS</button><button class="btn g" onclick="recs()">📊 RÉCORDS</button><button class="btn w" onclick="cfg()">⚙️ CONFIGURACIÓN</button></div>`)}
function play(){const n=D.done.indexOf(0);n<0?final():intro(n)}
function worlds(){theme(-1);V(`${hdr('🌎 Mundos')}<div class=gw>${W.map((w,i)=>{const o=1;return `<button class="btn ${o?'w':''}" style="${o?'':'background:rgba(0,0,0,.4)'}" ${o?`onclick="intro(${i})"`:'disabled'}><div style="font-size:44px">${o?w.i:'🔒'}</div><div class=t style="font-size:21px">${i+1}. ${w.n}</div><div style="font-size:15px">${D.medal[i]?['','🥉','🥈','🥇'][D.medal[i]]+' ':''}Jefe: ${w.b[0]}</div></button>`}).join('')}</div>`)}
function achs(){theme(-1);V(`${hdr('🏆 Logros')}<div class=list>${AL.map(a=>`<div class=row style="${D.ach[a[0]]?'':'opacity:.5'}"><span style="font-size:36px">${D.ach[a[0]]?a[1]:'🔒'}</span><div><div class=t style="font-size:22px">${a[2]}</div>${a[3]}</div></div>`).join('')}</div>`)}
function recs(){theme(-1);const r=D.rec,pd=[1,0,2].map(i=>r[i]?`<div style="background:${['#d89e00','#9aa4b2','#a8642a'][i]};height:${[150,110,80][i]}px"><div class=t style="font-size:26px">${['🥇','🥈','🥉'][i]}</div>${r[i].s}</div>`:'').join('');
V(`${hdr('📊 Récords')}${r.length?`<div class=pod>${pd}</div><div class=list>${r.map((x,i)=>`<div class=row><span class=t style="font-size:26px;width:34px">${i+1}</span><div style="flex:1">${x.w}<br><small>${x.d}</small></div><span class=t style="font-size:24px">${x.s}</span></div>`).join('')}</div>`:'<div class=card>Aún no hay partidas. ¡Juega para entrar en la tabla!</div>'}`)}
function cfg(){theme(-1);V(`${hdr('⚙️ Configuración')}<div style="display:grid;gap:12px;max-width:420px;width:100%;margin:auto"><button class="btn b" onclick="tg('sfx')">Efectos: ${D.sfx?'SÍ':'NO'}</button><button class="btn y" onclick="tg('mus')">Música: ${D.mus?'SÍ':'NO'}</button><button class="btn r" onclick="rst()">${rs?'¿Seguro? Pulsa otra vez para borrar todo':'Reiniciar partida'}</button></div>`)}
function tg(k){D[k]=D[k]?0:1;save();rs=0;if(k=='mus')music(-1);cfg()}
function rst(){if(!rs){rs=1;cfg();return}const s=D.sfx,m=D.mus;D=fresh();D.sfx=s;D.mus=m;rs=0;save();toast('Partida reiniciada');menu()}
/* ---------- Partida ---------- */
function genQ(w,k){const L=GN[w];let g;do{g=P(L)}while(L.length>1&&g===G.lg);G.lg=g;const q=g(k);q.fl=k==2||k==7;return q}
function intro(i){G={w:i,i:0,lives:3,score:0,st:0,ok:0,tot:0,hp:100,lost:0,tw:Date.now(),lg:null};G.qs=[0,1,2,3,4,5,6,7,8].map(k=>genQ(i,k));theme(i);music(i);
V(`<div style="margin:auto;text-align:center"><div style="font-size:90px">${W[i].i}</div><p>Mundo ${i+1}</p><h2 style="font-size:clamp(30px,8vw,46px)">${W[i].n}</h2><p id=cd class=t style="font-size:100px">3</p><p>Jefe: ${W[i].b[1]} ${W[i].b[0]}</p></div>`);
let c=3;const t=setInterval(()=>{c--;const e=$('#cd');if(!e||c<-0){clearInterval(t);return}if(c==0){e.textContent='¡YA!';return}if(c<0)return;e.textContent=c},750);setTimeout(()=>{clearInterval(t);if($('#cd'))ask()},2900)}
const hud=()=>`<span class=chip>${'❤️'.repeat(G.lives)||'💔'}</span><span class=chip>⭐ ${G.score}</span><span class=chip>🪙 ${D.coins}</span><span class=chip>🔥 x${mu()}</span><span class=chip>${av()} Nv ${lv()}</span>`;
function ask(){const q=G.qs[G.i],bo=G.i>=5,T=(q.t=='num'?30:q.t=='tf'?12:20)*(q.fl?.5:1);G.T=T;G.q=q;G.tq=Date.now();G.done=0;
V(`<div class=hud id=hd>${hud()}</div>${bo?`<div class=boss id=bs>${W[G.w].b[1]}<div class=bar style="max-width:360px;margin:6px auto"><b id=hp style="background:var(--r);width:${G.hp}%"></b></div><div class=t style="font-size:20px">${W[G.w].b[0]}</div></div>`:''}
<div class=bar><b id=tb style="width:100%"></b></div>
<div class=card><div>${bo?'⚔️ Combate contra el jefe':'Acertijo '+(G.i+1)+' de 5'}${q.fl?' · ⚡ RELÁMPAGO x2':''}</div><div class="q t">${q.q}</div></div>
${q.t=='num'?`<div class=card style="display:flex;gap:10px"><input id=in inputmode=decimal autocomplete=off placeholder="Escribe tu respuesta" style="flex:1;min-width:0;font:inherit;font-size:28px;padding:10px;border-radius:10px;border:3px solid #46178f"><button class="btn g" onclick="sub()">OK</button></div>`:`<div class=ans>${q.o.map((o,k)=>`<button class="btn ${q.t=='tf'?['b','r'][k]:'rbyg'[k]}" onclick="res(${k})"><span>${q.t=='tf'?['◆','▲'][k]:'▲◆●■'[k]}</span>${q.door?'🚪 ':''}${o}</button>`).join('')}</div>`}`);
if(q.t=='num')$('#in').focus();
G.iv=setInterval(()=>{const el=(Date.now()-G.tq)/1000,b=$('#tb');if(b)b.style.width=Math.max(0,100-el/T*100)+'%';if(el>=T)res(null)},100)}
const sub=()=>{const e=$('#in');if(e)res(e.value.trim()===''?'':e.value)};
function res(x){if(!G||G.done)return;G.done=1;clearInterval(G.iv);const q=G.q,el=Math.min(G.T,(Date.now()-G.tq)/1000),bo=G.i>=5;let ok=false,pts=0;
if(x!==null&&x!==''){if(q.t=='num'){const v=parseFloat(String(x).replace('−','-').replace(',','.'));ok=Math.abs(v-parseFloat(q.a))<.011}else ok=q.o[x]==q.a}
G.tot++;D.solved++;
if(ok){const m=mu();pts=Math.round(1000*(1-el/G.T/2)*m*(q.fl?2:1)/10)*10;G.score+=pts;G.st++;G.ok++;D.ok++;D.coins+=5*m+(q.fl?5:0);D.smax=Math.max(D.smax,G.st);addxp(10);if(el<3)D.fl.rayo=1;if(bo){G.hp-=25;const b=$('#bs');if(b)b.classList.add('shake')}sfx(1);burst(ok&&G.st>=3?90:45)}
else{G.st=0;G.lives--;G.lost++;sfx(0);if(bo)G.qs.push(genQ(G.w,8))}
chk();save();
if(q.t!='num'){const ci=q.o.indexOf(q.a);document.querySelectorAll('.ans .btn').forEach((b,i)=>b.classList.add(i==ci?'ok':'dim'));if(!ok&&x!==null)document.querySelectorAll('.ans .btn')[x].style.outline='4px dashed #fff'}
const hd=$('#hd');if(hd)hd.innerHTML=hud();const hp=$('#hp');if(hp)hp.style.width=Math.max(0,G.hp)+'%';const tb=$('#tb');if(tb)tb.style.width=0;
$('#v').insertAdjacentHTML('beforeend',`<div class=sheet style="background:var(--${ok?'g':'r'})"><div class=t style="font-size:30px">${ok?'¡Correcto! +'+pts:x===null?'¡Se acabó el tiempo!':'Incorrecto'}</div><p style="margin-top:4px">Respuesta: <b>${q.a}</b>. ${q.e}</p><button class="btn w" style="margin-top:10px" onclick="nxt()">Continuar ▶</button></div>`);
document.querySelector('.sheet').scrollIntoView({block:'end'})}
function nxt(){if(!G||!G.done)return;if(G.lives<=0)return over();if(G.hp<=0)return win();G.i++;ask()}
function finish(){D.score+=G.score;D.best=Math.max(D.best,G.score);D.time+=Math.round((Date.now()-G.tw)/1000);D.rec.push({s:G.score,w:W[G.w].n,d:new Date().toLocaleDateString('es')});D.rec.sort((a,b)=>b.s-a.s);D.rec=D.rec.slice(0,10)}
function win(){const w=G.w,acc=G.ok/G.tot,md=G.lost==0&&acc>=.9?3:acc>=.7?2:1;D.done[w]=1;D.medal[w]=Math.max(D.medal[w],md);D.coins+=50;addxp(50);if(G.lost==0)D.fl.imp=1;finish();chk();save();sfx(1);burst(150);music(-1);
const all=D.done.every(x=>x);setTimeout(()=>{if($('#nx'))all?final():intro(w+1)},6000);
V(`<div style="margin:auto;text-align:center;display:grid;gap:12px;width:100%"><div class=boss>${['🥉','🥈','🥇'][md-1]}</div><h2 style="font-size:clamp(32px,8vw,52px)">¡${W[w].b[0]} derrotado!</h2>
<div class=hud style="justify-content:center"><span class=chip>⭐ ${G.score}</span><span class=chip>🎯 ${Math.round(acc*100)}%</span><span class=chip>🪙 +50 bonus</span></div><p id=nx>${all?'Resultado final':'Siguiente mundo'} en 6 segundos…</p>
<div style="display:grid;gap:12px;max-width:420px;width:100%;margin:auto">${all?'<button class="btn r" onclick="final()">🏁 Ver resultado final</button>':`<button class="btn g" onclick="intro(${w+1})">Siguiente mundo ▶</button>`}<button class="btn b" onclick="worlds()">🌎 Mundos</button><button class="btn w" onclick="menu()">Menú</button></div></div>`)}
function over(){finish();save();music(-1);V(`<div style="margin:auto;text-align:center;display:grid;gap:12px;width:100%"><div class=boss>💔</div><h2 style="font-size:clamp(32px,8vw,52px)">¡Te quedaste sin vidas!</h2><p>Hiciste ⭐ ${G.score} puntos. Repasa las explicaciones e inténtalo de nuevo.</p><div style="display:grid;gap:12px;max-width:420px;width:100%;margin:auto"><button class="btn r" onclick="intro(${G.w})">↻ Reintentar mundo</button><button class="btn w" onclick="menu()">Menú</button></div></div>`)}
function final(){stopT();theme(6);music(6);burst(200);setTimeout(()=>burst(150),600);const acc=D.solved?D.ok/D.solved:0,g=D.medal.filter(x=>x==3).length,s=D.medal.filter(x=>x==2).length,b=D.medal.filter(x=>x==1).length,t=D.time,
rk=acc>=.9&&g>=5?'👑 Gran Matemático':acc>=.8?'🧠 Maestro':acc>=.65?'🚀 Explorador':'🌱 Aprendiz';
V(`<div style="margin:auto;text-align:center;display:grid;gap:12px;width:100%"><h1 style="font-size:clamp(40px,11vw,84px)">¡FELICIDADES!</h1><p style="max-width:520px;margin:auto">“Has completado MATH QUEST y demostrado que puedes convertir las matemáticas en un desafío.”</p>
<div class=gw style="max-width:640px;margin:auto"><div class=card>⭐ Puntuación final<div class=t style="font-size:34px">${D.score}</div></div><div class=card>⏱️ Tiempo<div class=t style="font-size:34px">${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}</div></div><div class=card>🧩 Acertijos resueltos<div class=t style="font-size:34px">${D.ok}</div></div><div class=card>🎯 Respuestas correctas<div class=t style="font-size:34px">${Math.round(acc*100)}%</div></div><div class=card>🏅 Medallas<div class=t style="font-size:30px">🥇${g} 🥈${s} 🥉${b}</div></div><div class=card>Rango final<div class=t style="font-size:28px">${rk}</div></div></div>
<div style="display:grid;gap:12px;max-width:420px;width:100%;margin:auto"><button class="btn b" onclick="worlds()">🌎 Rejugar mundos</button><button class="btn w" onclick="menu()">Menú</button></div></div>`)}
addEventListener('keydown',e=>{if(!G||!G.q)return;const k=+e.key;if(!G.done&&G.q.o&&k>=1&&k<=G.q.o.length&&$('.ans'))res(k-1);else if(e.key=='Enter'){if(G.done&&$('.sheet'))nxt();else if(!G.done&&$('#in'))sub()}});
menu();
</script></body></html>
